name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bootstrap
      - run: go test ./...
        working-directory: bootstrap
      - run: go test -race ./...
        working-directory: bootstrap
        if: runner.os != 'Windows'
      - run: pnpm check
      - run: pnpm test:runtime
      - run: pnpm validate:plugin
      - run: pnpm exec claude plugin validate . --strict
      - run: git diff --exit-code -- plugins/nexo/runtime plugins/nexo/bootstrap
      - run: pnpm audit --prod --audit-level high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  clean-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f bootstrap/clean-linux.Dockerfile -t nexo-no-node .
      - name: First install without Node, then offline cache reuse
        shell: bash
        run: |
          set -euo pipefail
          runtime_volume="nexo-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$runtime_volume"
          trap 'docker volume rm "$runtime_volume"' EXIT
          docker run --rm -v "$runtime_volume:/home/nexo/.claude/plugins/data/nexo-nexo-marketplace" nexo-no-node setup
          docker run --rm --network none -v "$runtime_volume:/home/nexo/.claude/plugins/data/nexo-nexo-marketplace" nexo-no-node setup
